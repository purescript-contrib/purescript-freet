package:
  name: freet
  description: Free monad transformers.
  publish:
    version: 7.0.1
    license: MIT
    location:
      githubOwner: purescript-contrib
      githubRepo: purescript-freet
  build:
    strict: true
  dependencies:
    - aff: ">=7.0.0 <9.0.0"
    - bifunctors: ">=6.0.0 <7.0.0"
    - control: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.0.0 <7.0.0"
    - exists: ">=6.0.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - free: ">=7.0.0 <8.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - tailrec: ">=6.0.0 <7.0.0"
    - transformers: ">=6.0.0 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    dependencies:
      - console
      - lists
      - maybe
workspace:
  packageSet:
    registry: 81.4.0
